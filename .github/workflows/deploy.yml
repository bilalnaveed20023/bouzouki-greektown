name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt one that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies — build.mjs is plain Node with no imports outside stdlib.
      - name: Build
        run: node build.mjs

      # This is a preview host, not the live domain. Keep it out of the index so
      # it cannot compete with bouzoukidetroit.com for the club's own name once
      # that goes live, and strip the sitemap that points at the real domain.
      - name: Mark the preview as non-indexable
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml
          for f in dist/*.html; do
            perl -0pi -e 's{<meta name="robots" content="[^"]*">}{<meta name="robots" content="noindex, nofollow">}' "$f"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
