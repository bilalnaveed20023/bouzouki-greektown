name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt one that is
# already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies — build.mjs is plain Node with no imports outside stdlib.
      - name: Build
        run: node build.mjs

      - uses: actions/configure-pages@v5
        id: pages

      # The source carries https://bouzoukidetroit.com as a stand-in origin.
      # Every deploy repoints it at wherever Pages is actually serving: the
      # github.io preview today, the club's own domain once it is attached in
      # Settings -> Pages (configure-pages then reports that domain as
      # base_url). Only the github.io preview is hidden from search engines,
      # so attaching the domain is the whole switch to "live" -- nothing in
      # this file has to change.
      - name: Point URLs at the serving origin
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          BASE="${BASE%/}"
          for f in dist/*.html dist/sitemap.xml dist/robots.txt; do
            if [ -f "$f" ]; then perl -0pi -e "s{https://bouzoukidetroit\\.com}{$BASE}g" "$f"; fi
          done
          case "$BASE" in
            *.github.io*)
              # Preview: noindex + disallow-all so it can never compete with
              # the real domain for the club's own name, and no sitemap.
              printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
              rm -f dist/sitemap.xml
              for f in dist/*.html; do
                perl -0pi -e 's{<meta name="robots" content="[^"]*">}{<meta name="robots" content="noindex, nofollow">}' "$f"
              done
              echo "preview host $BASE: noindex" ;;
            *)
              echo "live domain $BASE: indexable, sitemap kept" ;;
          esac
          grep -o 'og:image" content="[^"]*"' dist/index.html | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
